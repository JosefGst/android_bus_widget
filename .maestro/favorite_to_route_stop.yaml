# Favorite -> Routes Stop: tapping a Route row on My Favorites opens Routes Stop
# with that Stop expanded; back returns to My Favorites. Uses the starter
# Favorites (272P/272X) and the real KMB API.
appId: com.anonymous.bus
tags:
  - favorites
---
- runFlow:
    file: subflows/open_app.yaml
    env:
      CLEAR_STATE: "false"

- tapOn: "My Favorites"
- extendedWaitUntil:
    visible: "Open 272.*"
    timeout: 30000
- tapOn: "Open 272.*"

# Routes Stop shows the Stop expanded (its ETA line is visible).
- extendedWaitUntil:
    visible: "Route: 272.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*arrives in.*|No ETA available"
    timeout: 30000

# Back returns to My Favorites.
- back
- extendedWaitUntil:
    visible: "Local Time.*"
    timeout: 20000
