# Favorite -> Routes Stop: tapping a Route row on My Buses opens Routes Stop
# with that Stop expanded; back returns to My Buses. Uses the starter
# Favorites (272P/272X) and the real KMB API.
appId: com.anonymous.bus
tags:
  - favorites
---
- runFlow:
    file: subflows/open_app.yaml
    env:
      CLEAR_STATE: "false"

- tapOn:
    id: "tab-index"
- extendedWaitUntil:
    visible: "Open 272.*"
    timeout: 30000
- tapOn: "Open 272.*"

# Routes Stop opens with that Stop's card: next buses (or no time yet) and Saved.
- extendedWaitUntil:
    visible: "Route: 272.*"
    timeout: 20000
- extendedWaitUntil:
    visible: "Next bus|No time yet"
    timeout: 30000

# Back returns to My Buses.
- back
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 20000
