# From Find a Route, searches for Route 1A (outbound) and opens its Routes Stop screen.
appId: com.anonymous.bus
---
- tapOn:
    id: "clear-search"
- tapOn:
    id: "key-1"
- tapOn:
    id: "letter-A"
- tapOn: "1A, from Sau Mau Ping \\(Central\\) to Star Ferry"
- extendedWaitUntil:
    visible: "Route: 1A"
    timeout: 10000
- assertVisible: "From Sau Mau Ping \\(Central\\)"
# Stop rows are labelled "<seq>, <Stop name or id>". Reopening the same Route keeps its view and
# scroll position from an earlier flow, so show the list and scroll up to Stop 1.
- tapOn:
    id: "view-list"
- scrollUntilVisible:
    element: "1, .*"
    direction: UP
    timeout: 20000
