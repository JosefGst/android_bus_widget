# Find a Route: the Route list loads from the API and the on-screen keys filter it.
# Keys are tapped by id: a bare "1" would also match the "1" route badge.
appId: com.anonymous.bus
tags:
  - home
---
# Keeps storage so the 24h Route cache is reused (see subflows/open_app.yaml).
- runFlow:
    file: subflows/open_app.yaml
    env:
      CLEAR_STATE: "false"
- assertVisible: "Find a Route"
- tapOn:
    id: "clear-search"
- assertVisible: "1, from Chuk Yuen Estate to Star Ferry"

# Number + letter keys narrow the list to Route 1A.
- tapOn:
    id: "key-1"
- assertVisible:
    id: "letter-A"
- tapOn:
    id: "letter-A"
- assertVisible: "1A, from Sau Mau Ping \\(Central\\) to Star Ferry"
- assertVisible: "1A, from Star Ferry to Sau Mau Ping \\(Central\\)"
- assertVisible: "\\d+ routes match “1A”"
- assertNotVisible: "1, from Chuk Yuen Estate to Star Ferry"

# Delete removes the letter, so Route 1 is back.
- tapOn:
    id: "key-delete"
- assertVisible: "1, from Chuk Yuen Estate to Star Ferry"

# A search with no matching Route shows the empty state.
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-0"
- assertVisible: "No routes found."

# Clear resets the search.
- tapOn:
    id: "clear-search"
- assertVisible: "1, from Chuk Yuen Estate to Star Ferry"
