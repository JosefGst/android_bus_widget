# Favorites: starter Favorites, starring a Stop, removing it, and persistence.
appId: com.anonymous.bus
tags:
  - favorites
---
- runFlow: subflows/open_app.yaml

# A fresh install shows the two starter Favorites.
# "Refresh" marks My Buses with Favorites; it stays at the top, unlike "Change my buses".
- tapOn:
    id: "tab-index"
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 20000
- assertVisible: "Open 272P at .*"
- assertVisible: "Open 272X at .*"
- assertNotVisible: "Open 1A at .*"

# Saving the first Stop of 1A keeps Routes Stop open; My Buses then lists it.
- tapOn:
    id: "tab-find_route"
- runFlow: subflows/open_route_1a.yaml
- tapOn: "1, .*"
- tapOn: "Save to My Buses"
- assertVisible: "Saved to My Buses"
- tapOn:
    id: "tab-index"
- extendedWaitUntil:
    visible: "Open 1A at .*"
    timeout: 20000

# The Favorite survives an app restart.
- runFlow:
    file: subflows/open_app.yaml
    env:
      CLEAR_STATE: "false"
- tapOn:
    id: "tab-index"
- extendedWaitUntil:
    visible: "Open 1A at .*"
    timeout: 20000

# Removing it takes it off the list, and it stays removed after a restart.
- scrollUntilVisible:
    element: "Change my buses"
- tapOn: "Change my buses"
- tapOn: "Remove 1A at .*"
- tapOn: "Done"
- assertNotVisible: "Open 1A at .*"
- assertVisible: "Open 272P at .*"
- runFlow:
    file: subflows/open_app.yaml
    env:
      CLEAR_STATE: "false"
- tapOn:
    id: "tab-index"
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 20000
- assertNotVisible: "Open 1A at .*"
- assertVisible: "Open 272P at .*"
