# Routes Stop: the map (WebView) above the Stop list, resizing the map, and opening a Stop (next buses + Save).
appId: com.anonymous.bus
tags:
  - routes_stop
  - map
---
# Keeps storage so the 24h Route/Stop caches are reused (see subflows/open_app.yaml).
- runFlow:
    file: subflows/open_app.yaml
    env:
      CLEAR_STATE: "false"
- runFlow: subflows/open_route_1a.yaml

# Stop names come from /stop (title-cased); when that fails the rows show ids and a Retry row.
- assertVisible: "1, Sau Mau Ping \\(Central\\)"
- assertNotVisible: "Couldn't load stop names.*"

# Tapping a Stop opens its card with the next buses (or "No time yet") and Save.
# Stop 2, not 1: favorites.yaml saves Stop 1 of 1A, and reopening a Route keeps its open Stop.
- tapOn: "2, .*"
- extendedWaitUntil:
    visible: "Next bus|No time yet"
    timeout: 15000
- assertVisible: "Saved? to My Buses"
# Tapping the open Stop again closes it.
- tapOn: "2, .*"
- assertNotVisible: "Next bus|No time yet"

# The map is always shown above the Stop list, with the Lands Department attribution.
- assertVisible:
    id: "route-map"
- assertNotVisible: "Map unavailable"
- extendedWaitUntil:
    visible: ".*Map information from Lands Department"
    timeout: 15000
- assertVisible: "Whole route"

# Tapping the handle steps the map through a third, half and large, then back to a third.
# The size is remembered, so the flow ends on a third for the other flows.
- assertVisible: "Map size: a third.*"
- tapOn:
    id: "map-resize-handle"
- assertVisible: "Map size: half.*"
- tapOn:
    id: "map-resize-handle"
- assertVisible: "Map size: large.*"
- tapOn:
    id: "map-resize-handle"
- assertVisible: "Map size: a third.*"
