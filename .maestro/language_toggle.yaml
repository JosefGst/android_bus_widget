# Language button: cycles English → 繁 → 简 → English across Home and Routes Stop.
# Ends on English, because every other flow taps English labels.
appId: com.anonymous.bus
tags:
  - language
---
- runFlow:
    file: subflows/open_app.yaml
    env:
      CLEAR_STATE: "false"
# On some ROMs killApp leaves the app running, so an earlier search can still be typed.
- tapOn:
    id: "clear-search"
- assertVisible: "1, from Chuk Yuen Estate to Star Ferry"

- tapOn:
    id: "language-button"
- assertVisible: "繁"
- assertVisible: "1，由竹園邨往尖沙咀碼頭"
- assertVisible: "搜尋路線"
- assertVisible: "我的巴士"

# Routes Stop: Stop names, buttons and map attribution in Traditional Chinese.
- tapOn: "1，由竹園邨往尖沙咀碼頭"
- assertVisible: "路線：1"
- assertVisible: "隱藏地圖"
- extendedWaitUntil:
    visible: ".*地圖資料由地政總署提供.*"
    timeout: 20000

- tapOn:
    id: "language-button"
- assertVisible: "简"
- assertVisible: "隐藏地图"
- assertVisible: "搜索路线"
- extendedWaitUntil:
    visible: ".*地图资料由地政总署提供.*"
    timeout: 20000

- tapOn:
    id: "language-button"
- assertVisible: "EN"
- assertVisible: "Hide map"
- assertVisible: "Route: 1"
- back
- assertVisible: "1, from Chuk Yuen Estate to Star Ferry"
